name: Build and Release

on:
  push:
    branches: [main]

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # A release only happens on an exact "Bump version X.Y.Z" commit. Every
      # other push (including test builds such as 1.27.2-test.1) still builds
      # and publishes an artifact, it just never tags or releases.
      - name: Check for version bump commit
        id: version
        run: |
          COMMIT_MSG=$(git log -1 --pretty=%s)
          if [[ "$COMMIT_MSG" =~ ^Bump\ version\ ([0-9]+\.[0-9]+\.[0-9]+)$ ]]; then
            echo "version=${BASH_REMATCH[1]}" >> "$GITHUB_OUTPUT"
            echo "should_release=true" >> "$GITHUB_OUTPUT"
          else
            echo "should_release=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Read version files
        id: tool_versions
        run: |
          NODEJS_VERSION=$(grep '^nodejs' .tool-versions | awk '{print $2}')
          PEBBLE_TOOL_VERSION=$(grep '^tool' .pebble-versions | awk '{print $2}')
          PEBBLE_SDK_VERSION=$(grep '^sdk' .pebble-versions | awk '{print $2}')
          PACKAGE_VERSION=$(node -p "require('./package.json').version")
          echo "nodejs=$NODEJS_VERSION" >> "$GITHUB_OUTPUT"
          echo "pebble_tool=$PEBBLE_TOOL_VERSION" >> "$GITHUB_OUTPUT"
          echo "pebble_sdk=$PEBBLE_SDK_VERSION" >> "$GITHUB_OUTPUT"
          echo "package=$PACKAGE_VERSION" >> "$GITHUB_OUTPUT"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ steps.tool_versions.outputs.nodejs }}
          cache: "npm"

      - name: Install npm dependencies
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      # Kept separate from `pebble build` (which re-runs it inside waf) so a
      # TypeScript or bundling failure is attributable to its own step.
      - name: Build JS bundle
        run: npm run build

      - name: Install Pebble SDK system dependencies
        run: sudo apt-get install -y libsdl1.2debian libfdt1 libsdl2-2.0-0 libpixman-1-0

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Cache pebble-tool
        id: cache_pebble_tool
        uses: actions/cache@v4
        with:
          path: ~/.local/share/uv/tools/pebble-tool
          key: pebble-tool-${{ steps.tool_versions.outputs.pebble_tool }}

      - name: Install pebble-tool
        run: uv tool install pebble-tool==${{ steps.tool_versions.outputs.pebble_tool }} --python 3.13

      - name: Add pebble-tool to PATH
        run: echo "$HOME/.local/share/uv/tools/pebble-tool/bin" >> $GITHUB_PATH

      - name: Install Pebble SDK
        run: pebble sdk install ${{ steps.tool_versions.outputs.pebble_sdk }} && pebble sdk activate ${{ steps.tool_versions.outputs.pebble_sdk }}

      - name: Build
        run: pebble build

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          # The Pebble manifest version cannot carry a suffix, so test builds
          # share a version with the last release; the run number tells them apart.
          name: kagi-news-${{ steps.tool_versions.outputs.package }}-${{ github.run_number }}
          path: build/*.pbw
          if-no-files-found: error

      - name: Verify package version matches the bump
        if: steps.version.outputs.should_release == 'true'
        run: |
          if [[ "${{ steps.tool_versions.outputs.package }}" != "${{ steps.version.outputs.version }}" ]]; then
            echo "package.json says ${{ steps.tool_versions.outputs.package }} but the commit says ${{ steps.version.outputs.version }}"
            exit 1
          fi

      - name: Generate release notes
        if: steps.version.outputs.should_release == 'true'
        id: release_notes
        run: |
          PREV_BUMP=$(git log --pretty=format:"%H %s" \
            | grep -E "^[0-9a-f]+ Bump version [0-9]+\.[0-9]+\.[0-9]+" \
            | sed -n '2p' \
            | awk '{print $1}')

          if [ -z "$PREV_BUMP" ]; then
            NOTES=$(git log --pretty=format:"- %s" | grep -vE "^- Bump version [0-9]+\.[0-9]+\.[0-9]+$")
          else
            NOTES=$(git log --pretty=format:"- %s" "${PREV_BUMP}..HEAD" | grep -vE "^- Bump version [0-9]+\.[0-9]+\.[0-9]+$")
          fi

          {
            echo "notes<<EOF"
            echo "$NOTES"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        if: steps.version.outputs.should_release == 'true'
        uses: softprops/action-gh-release@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          tag_name: v${{ steps.version.outputs.version }}
          name: v${{ steps.version.outputs.version }}
          body: ${{ steps.release_notes.outputs.notes }}
          files: build/*.pbw
          fail_on_unmatched_files: true
